# Empaquetado del shell de escritorio (npm run escritorio:win | escritorio:mac).
#
# Canales decididos en el master plan: Microsoft Store (.appx, canal principal
# de Windows) + instalador NSIS sin firma y dmg/zip notarizados en GitHub
# Releases (no caben en Cloudflare Pages: 25 MB/archivo).
appId: com.macr120.mindhome
productName: Mind Planner Home
# Sin espacios en los artefactos: en GitHub Releases las URLs quedan limpias.
artifactName: MindPlannerHome-${version}-${os}.${ext}
directories:
  output: dist-escritorio
  buildResources: electron/build
# Solo la web compilada y el main: main.js no importa ninguna dependencia y la
# web ya viene empaquetada por Vite, así que node_modules sobra entero.
files:
  - dist/**/*
  - electron/main.js
  - electron/precarga.cjs
  - electron/fondo.ps1
  - electron/fondo-raton.ps1
  - electron/fondo-musica.ps1
  - "!node_modules/**/*"
# Sin asar: `net.fetch(file://…)` (con el que main.js sirve dist/) pasa por el
# cargador de Chromium, que NO lee dentro de un .asar — empaquetado serviría
# 404s aunque en dev funcione. Son archivos estáticos; no hay nada que ocultar.
asar: false

# El esquema por el que vuelve el login social desde el navegador del sistema.
# Es el MISMO que Android e iOS y ya está en las Redirect URLs de Supabase (ver
# `ESQUEMA_PROFUNDO` en electron/main.js). En macOS esto se convierte en el
# `CFBundleURLTypes` del bundle; en Windows lo registra el instalador NSIS y el
# enlace entra como un argumento más en `second-instance`.
protocols:
  - name: Mind Planner Home
    schemes:
      - com.macr120.mindhome

win:
  target:
    - nsis
    - appx
nsis:
  oneClick: true
  # Desinstalar NO borra los datos (IndexedDB): son la casa del usuario.
  deleteAppDataOnUninstall: false
appx:
  backgroundColor: '#0f1115'
  # Identidad que asignó Microsoft Store al reservar el nombre (26 ago 2026).
  # Copiada TAL CUAL de Partner Center → producto → Product identity: si no
  # coincide al carácter, la tienda rechaza el paquete. Store ID 9N893LFZHR0T
  # (https://apps.microsoft.com/detail/9N893LFZHR0T).
  identityName: MindPlannerHome.MindPlannerHome
  publisher: CN=7F375BA0-7942-4F15-B517-65268E256FDE
  publisherDisplayName: Mind Planner Home
  # Los 16 de `src/core/i18n/idiomas.ts`. Van aquí porque **Partner Center saca
  # del PAQUETE los idiomas de la ficha**: sin declararlos, la tienda daría MPH
  # por monolingüe. El primero es el de reserva.
  languages:
    - en-US
    - es-MX
    - pt-BR
    - fr-FR
    - de-DE
    - it-IT
    - ja-JP
    - zh-CN
    - ko-KR
    - ru-RU
    - hi-IN
    - tr-TR
    - id-ID
    - pl-PL
    - nl-NL
    - ar-SA

mac:
  category: public.app-category.productivity
  # El icono de macOS NO es el cuadrado de Windows: Apple espera el squircle ya
  # dibujado, con su margen (retícula de 824 en 1024). Lo genera
  # scripts/icono-escritorio.mjs junto al cuadrado, que se queda para el .ico y
  # los mosaicos de Store — ahí el redondeo sería un error.
  icon: electron/build/icono-mac.png
  # Los permisos, traducidos: macOS lee `<idioma>.lproj/InfoPlist.strings` de
  # Resources igual que iOS, así que se reusan LOS MISMOS archivos del proyecto
  # de iOS en vez de mantener una segunda copia. El original inglés sigue abajo,
  # en extendInfo, como en el Info.plist del teléfono.
  extraResources:
    - from: ios/App/App
      to: .
      filter:
        - "*.lproj/InfoPlist.strings"
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.plist
  # Notariza al compilar en el Mac. Credenciales por variables de entorno:
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID (9FA4Z58JF3).
  notarize: true
  extendInfo:
    # En inglés como el idioma base de las fichas; sin estos textos macOS mata
    # la app al pedir cámara (Chat AR) o micrófono (dictado).
    NSCameraUsageDescription: The AR chat uses the camera to show your assistant in your room.
    NSMicrophoneUsageDescription: The microphone lets you dictate messages to your assistant.
    # El panel de música del fondo pregunta a Música/Spotify qué suena.
    NSAppleEventsUsageDescription: To show what's playing in Music or Spotify on your wallpaper.
