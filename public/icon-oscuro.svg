<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de la app, versión OSCURA: las mismas piezas de icon.svg sobre
       negro. No lo lee el manifest (la PWA no distingue aspecto): es la variante
       que se entrega donde la plataforma sí cambia el icono con el aspecto —el
       catálogo de iOS 18 (appearance «dark»), los mosaicos «unplated» de la
       barra de tareas de Windows y el icono de la ventana/Dock del shell de
       escritorio (electron/main.js, por nativeTheme)—. Misma geometría y zona
       segura que icon.svg; la sombra vuelve a su opacidad de siempre porque
       sobre negro casi no se ve. -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="naranja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc53f"/>
      <stop offset="1" stop-color="#f6a413"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6573"/>
      <stop offset="1" stop-color="#f53b4b"/>
    </linearGradient>
    <linearGradient id="morado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d199ff"/>
      <stop offset="1" stop-color="#b36bfb"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-40%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="1" dy="7" result="desplazada"/>
      <feFlood flood-color="#000" flood-opacity=".65"/>
      <feComposite in2="desplazada" operator="in"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <g transform="translate(77.5 206)">
    <g filter="url(#sombra)" transform="translate(3 3)">
      <rect y="3" width="94" height="94" rx="20"/>
      <path d="M137 0V100H237Z"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z"/>
    </g>
    <g transform="translate(3 3)">
      <rect y="3" width="94" height="94" rx="20" fill="#c14a05"/>
      <path d="M137 0V100H237Z" fill="#8e0a24"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="#8935d8"/>
    </g>
    <rect y="3" width="94" height="94" rx="20" fill="url(#naranja)"/>
    <path d="M137 0V100H237Z" fill="url(#rojo)"/>
    <path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="url(#morado)"/>
    <g fill="none" stroke="url(#brillo)" stroke-width="1.5">
      <rect y="3" width="94" height="94" rx="20"/>
      <path d="M137 0V100H237Z"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z"/>
    </g>
  </g>
</svg>
