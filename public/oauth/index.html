<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MindHaOS</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: light dark; --fondo: #f7f4ef; --texto: #1f1b16; --suave: #6b6359; --acento: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #15120f; --texto: #f3eee7; --suave: #a89f94; --acento: #fdba74; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 0 16px; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.4rem; margin: 16px 0 4px; }
  p { color: var(--suave); margin: 0 0 20px; }
  a { display: inline-block; padding: 10px 22px; border-radius: 999px; background: var(--acento); color: var(--fondo);
    font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="/icon-oscuro.svg" media="(prefers-color-scheme: dark)">
    <img src="/icon.svg" alt="">
  </picture>
  <h1 id="titulo">Listo</h1>
  <p id="texto">Vuelve a MindHaOS. Ya puedes cerrar esta pestaña.</p>
  <a id="abrir" href="#">Abrir MindHaOS</a>
</main>
<script src="/oauth/listo.js"></script>
</body>
</html>
