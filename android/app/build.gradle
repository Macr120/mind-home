apply plugin: 'com.android.application'

// Firma de release. Las credenciales viven en `android/key.properties` y el
// keystore FUERA del repo (ambos ignorados por git): quien clone el proyecto
// compila igual, solo que su release sale sin firmar. Perder el keystore de
// subida significa no poder volver a actualizar la app en Play NUNCA, así que su
// copia de seguridad no es opcional.
def archivoClaves = rootProject.file('key.properties')
def clavesRelease = new Properties()
if (archivoClaves.exists()) {
    archivoClaves.withInputStream { clavesRelease.load(it) }
}

android {
    namespace = "com.macr120.mindhome"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.macr120.mindhome"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (archivoClaves.exists()) {
                storeFile file(clavesRelease['storeFile'])
                storePassword clavesRelease['storePassword']
                keyAlias clavesRelease['keyAlias']
                keyPassword clavesRelease['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Sin `key.properties` no se asigna: Gradle fallaría al configurar
            // con un signingConfig a medio rellenar.
            if (archivoClaves.exists()) signingConfig signingConfigs.release
            // R8: Play exige/premia código minificado y con metadatos. El mapping de
            // desofuscación viaja DENTRO del .aab (BUNDLE-METADATA), no se sube aparte.
            // Los plugins sobreviven porque Capacitor y RevenueCat traen sus propias
            // reglas de consumidor (keep de toda clase que extiende Plugin).
            minifyEnabled true
            shrinkResources true
            // `proguard-android.txt` desapareció en AGP 9 («no longer supported»);
            // la variante -optimize existe desde AGP 3 y es la recomendada, así
            // que vale para la 8.13 de hoy y para cuando se actualice.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Android Studio compila el proyecto Android tal cual está en disco: no corre
// `npm run build` ni copia el resultado. Sin esto, generar el bundle desde el IDE
// empaqueta el `dist` de la última vez —el AAB sale con la app de hace horas— y
// no hay ninguna señal de que pasó. Se engancha SOLO en release, que es lo que
// sube a la tienda; en debug estorbaría al iterar con live reload.
// `cap copy` y no `cap sync`: copy mueve los assets web, mientras que sync además
// reescribe `capacitor.build.gradle`, y tocar un .gradle a mitad de build es
// justo lo que no se debe hacer. Si añades un plugin, corre `npx cap sync android`
// a mano esa vez.
def esWindows = System.getProperty('os.name').toLowerCase().contains('windows')
tasks.register('construirWeb', Exec) {
    description = 'Compila la web y la copia a los assets de Android (solo release).'
    workingDir rootProject.projectDir.parentFile
    if (esWindows) {
        commandLine 'cmd', '/c', 'npm run build && npx cap copy android'
    } else {
        commandLine 'sh', '-c', 'npm run build && npx cap copy android'
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure { dependsOn 'construirWeb' }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
