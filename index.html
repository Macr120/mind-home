<html lang="en">

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <title>Mind Planner Home</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
