<!doctype html>
<!-- Plantilla: ver web/index.html. Los textos viven en web/i18n/paginas/<id>.mjs.
     La página a la que apuntan los perfiles de las redes (mindhaos.com/<id>/download?r=<red>):
     en el teléfono abre sola su tienda; en lo demás pone primero el botón de su sistema. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--idioma-script-->
    <title>{{bajar.titulo|attr}} — MindHaOS</title>
    <meta name="description" content="{{bajar.sub|attr}}" />
    <meta property="og:title" content="{{bajar.titulo|attr}} — MindHaOS" />
    <meta property="og:description" content="{{bajar.sub|attr}}" />
    <meta property="og:image" content="https://mindhaos.com/og.png" />
    <meta name="theme-color" content="#e9edf5" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="stylesheet" href="/estilos.css" />
    <style>
      .bajar { max-width: 460px; margin: 0 auto; padding: 40px 16px 24px; text-align: center; }
      .bajar h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.1; margin: 18px 0 12px; }
      .bajar .sub { margin: 0 auto 26px; opacity: 0.8; }
      .bajar .piezas { width: 150px; margin: 0 auto; }
      .tiendas { display: flex; flex-direction: column; gap: 12px; }
      .tiendas .boton { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 18px; font-size: 16px; }
      .tiendas .logo-plat { width: 22px; height: 22px; fill: currentColor; flex: none; }
      .tiendas .logo-plat.trazo { fill: none; stroke: currentColor; stroke-width: 1.8; }
      .abriendo { margin: 0 0 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <header class="barra-marco">
      <div class="contenedor barra">
        <a class="logo" href="/acerca">
          <svg class="logo-piezas" viewBox="0 0 357 100" aria-hidden="true"><rect y="3" width="94" height="94" rx="20" fill="#FFB319"/><path d="M137 0V100H237Z" fill="#FF505F"/><path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="#C07DFE"/></svg>
          <span class="nombre">
            {{marca.nombre}}
            <small>{{marca.sub}}</small>
          </span>
        </a>
        <nav>
          <!--selector-idiomas-->
          <!--boton-tema-->
        </nav>
      </div>
    </header>

    <main class="bajar">
      <svg class="piezas" viewBox="0 0 357 100" aria-hidden="true"><rect y="3" width="94" height="94" rx="20" fill="#FFB319"/><path d="M137 0V100H237Z" fill="#FF505F"/><path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="#C07DFE"/></svg>
      <h1>{{hero.h1}}</h1>
      <p class="sub">{{bajar.sub}}</p>
      <p class="abriendo" id="abriendo" hidden>{{bajar.abriendo}}</p>

      <div class="tiendas" id="tiendas">
        <a class="boton ui-boton" data-tienda="apple" href="https://apps.apple.com/app/id6804840611">
          <svg class="logo-plat" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" /></svg>
          {{bajar.ios.cta}}
        </a>
        <a class="boton ui-boton" data-tienda="play" href="https://play.google.com/store/apps/details?id=com.macr120.mindhome">
          <svg class="logo-plat" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z" /></svg>
          {{desc.android.cta}}
        </a>
        <a class="boton ui-boton" data-tienda="microsoft" href="https://apps.microsoft.com/detail/9N893LFZHR0T">
          <svg class="logo-plat" viewBox="0 0 24 24" aria-hidden="true"><path d="M0,0H11.377V11.372H0ZM12.623,0H24V11.372H12.623ZM0,12.623H11.377V24H0Zm12.623,0H24V24H12.623" /></svg>
          {{desc.windows.cta}}
        </a>
        <a class="boton ui-boton" data-tienda="web" href="https://app.mindhaos.com/">
          <svg class="logo-plat trazo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M2 12h20" /><path d="M12 2a15.3 15.3 0 0 1 0 20a15.3 15.3 0 0 1 0-20Z" /></svg>
          {{desc.web.cta}}
        </a>
      </div>
    </main>

    <!-- Cada enlace lleva de qué red e idioma viene (`?r=tiktok` en el perfil), en el
         formato que lee cada consola: `referrer` con UTM en Play, `cid` en Microsoft
         Store, `ct` en Apple (cuenta en «Campañas» solo con el `pt` del proveedor; sin
         él Apple igual anota mindhaos.com como sitio de referencia) y UTM en la web. -->
    <script>
      (function () {
        var PT_APPLE = ''
        var red = (new URLSearchParams(location.search).get('r') || 'web').replace(/[^\w-]/g, '').slice(0, 20) || 'web'
        var idioma = document.documentElement.lang
        var campana = red + '-' + idioma
        var ua = navigator.userAgent
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
        var mac = !ios && /Macintosh/.test(ua)
        var android = /Android/.test(ua)
        var windows = /Windows/.test(ua)
        var enlaces = {}
        document.querySelectorAll('#tiendas a').forEach(function (a) {
          var t = a.dataset.tienda
          var u = new URL(a.href)
          if (t === 'play') u.searchParams.set('referrer', 'utm_source=' + red + '&utm_medium=perfil&utm_campaign=' + idioma)
          if (t === 'microsoft') u.searchParams.set('cid', campana)
          if (t === 'apple') {
            u.searchParams.set('ct', campana)
            u.searchParams.set('mt', '8')
            if (PT_APPLE) u.searchParams.set('pt', PT_APPLE)
          }
          if (t === 'web') {
            u.searchParams.set('utm_source', red)
            u.searchParams.set('utm_campaign', idioma)
          }
          a.href = u.toString()
          enlaces[t] = a
        })
        var propia = ios || mac ? 'apple' : android ? 'play' : windows ? 'microsoft' : null
        if (!propia) return
        var boton = enlaces[propia]
        boton.classList.add('principal', 'ui-accent-bg')
        boton.parentNode.insertBefore(boton, boton.parentNode.firstChild)
        // En el teléfono se abre la tienda sola: es el «un toque» desde el perfil de la red.
        // La página se queda detrás por si el navegador interno de la red no la deja salir.
        if (ios || android) {
          document.getElementById('abriendo').hidden = false
          setTimeout(function () { location.href = boton.href }, 500)
        }
      })()
    </script>
  </body>
</html>
