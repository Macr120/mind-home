<!doctype html>
<!-- Portada de las guías (/guias y /<id>/guias). Plantilla como web/soporte.html:
     los textos fijos viven en web/i18n/paginas/<id>.mjs (claves `guias.*`) y la
     lista de guías la pinta scripts/guias-web.mjs desde los guiones de cada idioma. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--idioma-script-->
    <title>{{guias.titulo|attr}}</title>
    <meta name="description" content="{{guias.desc|attr}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{guias.titulo|attr}}" />
    <meta property="og:description" content="{{guias.desc|attr}}" />
    <meta property="og:image" content="https://mindhaos.com/og.png" />
    <meta name="theme-color" content="#e9edf5" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="stylesheet" href="/estilos.css" />
    <style>
      /* Más específico que `.legal ul/li/h2`: aquí la lista son tarjetas, no texto con viñetas. */
      .legal .guias-lista {
        display: grid;
        gap: 16px;
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
      }
      .legal .guias-lista li {
        padding: 0;
        color: var(--ui-ink);
      }
      .legal .guias-lista li::marker {
        content: none;
      }
      .guia-tarjeta {
        display: grid;
        grid-template-columns: 180px 1fr;
        overflow: hidden;
        border-radius: 18px;
        background: var(--ui-panel);
        border: 1px solid var(--borde);
        box-shadow: 0 10px 28px rgb(0 0 0 / 0.08);
        color: inherit;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        animation: guia-entra 0.44s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .guia-tarjeta:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 36px rgb(0 0 0 / 0.12);
      }
      .guia-tarjeta img {
        width: 100%;
        height: 100%;
        min-height: 150px;
        object-fit: cover;
      }
      .guia-tarjeta div {
        padding: 18px 20px;
      }
      .legal .guia-tarjeta h2 {
        margin: 0 0 6px;
        font-size: 21px;
        color: var(--ui-ink);
      }
      .legal .guia-tarjeta p {
        margin: 0 0 12px;
        font-size: 15px;
        color: var(--tinta-2);
        line-height: 1.5;
      }
      .guia-meta {
        font-size: 13px;
        font-weight: 700;
        color: var(--ui-accent);
      }
      @keyframes guia-entra {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
      }
      @media (max-width: 560px) {
        .guia-tarjeta {
          grid-template-columns: 1fr;
        }
        .guia-tarjeta img {
          height: 150px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .guia-tarjeta {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="barra-marco">
      <div class="contenedor barra">
        <a class="logo" href="/acerca">
          <svg class="logo-piezas" viewBox="0 0 357 100" aria-hidden="true"><rect y="3" width="94" height="94" rx="20" fill="#FFB319"/><path d="M137 0V100H237Z" fill="#FF505F"/><path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="#C07DFE"/></svg>
          <span class="nombre">
            {{marca.nombre}}
            <small>{{marca.sub}}</small>
          </span>
        </a>
        <nav>
          <!--selector-idiomas-->
          <!--boton-tema-->
        </nav>
      </div>
    </header>

    <main class="legal">
      <h1>{{guias.h1}}</h1>
      <p>{{guias.p}}</p>
      <ul class="guias-lista"><!--guias-lista--></ul>
    </main>

    <div class="contenedor">
      <footer>
        <div class="enlaces">
          <a href="/acerca">{{pie.inicio}}</a>
          <a href="/privacidad">{{pie.privacidad}}</a>
          <a href="/terminos">{{pie.terminos}}</a>
          <a href="/soporte#contacto">{{pie.contacto}}</a>
        </div>
        <p>© 2026 MindHaOS · Marco Antonio Cabanillas Ramirez</p>
      </footer>
    </div>
  </body>
</html>
