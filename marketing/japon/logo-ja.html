<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#fff}body{width:1024px;height:1024px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;color:#1a1a1a}svg{width:700px;height:auto;margin-bottom:6px}.lat{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:150px;font-weight:700;line-height:1;letter-spacing:1px}.jp{margin-top:34px;font-size:92px;font-weight:600;letter-spacing:10px;line-height:1;color:#2a2a2a}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="40 165 432 185">
  <!-- Icono de la app (manifest), versión CLARA: las piezas sobre blanco.
       Maskable: las figuras caben en la zona segura (círculo centrado de radio
       40% = 205px), así ningún recorte de Android se lleva un trozo del logo.
       Fondo opaco a propósito: iOS y Android rellenan la transparencia con un
       color que no elegimos.
       Acabado con relieve (7 sep 2026): cada pieza lleva un canto oscuro
       desplazado abajo-derecha, una sombra difusa y un brillo en el borde
       iluminado. La sombra va más suave que en icon-oscuro.svg: sobre blanco,
       la misma opacidad ensucia el fondo. favicon.svg es el mismo dibujo sin
       fondo; icon-oscuro.svg, el mismo dibujo sobre negro (variante para el
       aspecto oscuro donde la plataforma lo permite). -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </radialGradient>
    <linearGradient id="naranja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc53f"/>
      <stop offset="1" stop-color="#f6a413"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6573"/>
      <stop offset="1" stop-color="#f53b4b"/>
    </linearGradient>
    <linearGradient id="morado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d199ff"/>
      <stop offset="1" stop-color="#b36bfb"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-40%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="1" dy="7" result="desplazada"/>
      <feFlood flood-color="#000" flood-opacity=".28"/>
      <feComposite in2="desplazada" operator="in"/>
    </filter>
  </defs>
  
  <g transform="translate(77.5 206)">
    <!-- Sombra: la silueta de las piezas con su canto, desenfocada. -->
    <g filter="url(#sombra)" transform="translate(3 3)">
      <rect y="3" width="94" height="94" rx="20"/>
      <path d="M137 0V100H237Z"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z"/>
    </g>
    <!-- Canto: la misma pieza en su tono oscuro, corrida abajo-derecha. -->
    <g transform="translate(3 3)">
      <rect y="3" width="94" height="94" rx="20" fill="#c14a05"/>
      <path d="M137 0V100H237Z" fill="#8e0a24"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="#8935d8"/>
    </g>
    <!-- Caras. -->
    <rect y="3" width="94" height="94" rx="20" fill="url(#naranja)"/>
    <path d="M137 0V100H237Z" fill="url(#rojo)"/>
    <path d="M257 0H357V100A100 100 0 0 1 257 0Z" fill="url(#morado)"/>
    <!-- Brillo del borde iluminado (arriba-izquierda). -->
    <g fill="none" stroke="url(#brillo)" stroke-width="1.5">
      <rect y="3" width="94" height="94" rx="20"/>
      <path d="M137 0V100H237Z"/>
      <path d="M257 0H357V100A100 100 0 0 1 257 0Z"/>
    </g>
  </g>
</svg>
<div class=lat>MindHaOS</div><div class=jp>心の家 OS</div>
